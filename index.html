<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World – Alternating Colors & Font Sizes</title>
    <style>
        /* ── Reset & full‑page centering ── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0e14;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            margin: 0;
            padding: 1rem;
        }

        /* ── Main card ── */
        .card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 3rem;
            padding: 3rem 4rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8),
                inset 0 1px 2px rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: scale(1.01);
        }

        /* ── The animated "Hello World" container ── */
        .hello-world {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: baseline;
            gap: 0.02em;
            letter-spacing: 0.04em;
            user-select: none;
        }

        /* ── Each character is a <span> ── */
        .hw-char {
            display: inline-block;
            font-weight: 700;
            transition: transform 0.2s ease, text-shadow 0.2s ease;
            cursor: default;
            line-height: 1.2;
        }

        /* subtle hover pop */
        .hw-char:hover {
            transform: scale(1.15) translateY(-4px);
            filter: brightness(1.2);
        }

        /* ── Space character gets a fixed width ── */
        .hw-char.space {
            min-width: 0.5em;
        }

        /* ── Responsive tweaks ── */
        @media (max-width: 600px) {
            .card {
                padding: 2rem 1.5rem;
                border-radius: 2rem;
            }
            .hello-world {
                gap: 0.01em;
                letter-spacing: 0.02em;
            }
        }

        @media (max-width: 400px) {
            .card {
                padding: 1.5rem 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="hello-world" id="helloWorld">
            <!-- characters will be injected by JavaScript -->
        </div>
    </div>

    <script>
        (function() {
            const container = document.getElementById('helloWorld');

            // ── The text we want to display ──
            const text = 'Hello World';

            // ── Color palette (vivid, alternating) ──
            const colors = [
                '#f94144', // red
                '#f8961e', // orange
                '#f9c74f', // yellow
                '#90be6d', // green
                '#43aa8b', // teal
                '#577590', // blue
                '#9b5de5', // purple
                '#f15bb5', // pink
                '#00bbf9', // cyan
                '#fee440', // gold
                '#00f5d4', // mint
            ];

            // ── Font‑size range (in rem) ──
            const minSize = 1.8;
            const maxSize = 4.2;

            // ── Build each character as a <span> ──
            const chars = text.split('');

            chars.forEach((char, index) => {
                const span = document.createElement('span');
                span.className = 'hw-char';

                // If it's a space, add a class for styling
                if (char === ' ') {
                    span.classList.add('space');
                    span.textContent = '\u00A0'; // non‑breaking space for consistent width
                } else {
                    span.textContent = char;
                }

                // ── Alternating color (cycle through palette) ──
                const colorIndex = index % colors.length;
                span.style.color = colors[colorIndex];

                // ── Alternating font‑size (oscillate between min and max) ──
                // Use a sine‑like pattern so sizes go up and down smoothly.
                // We'll use a simple triangular wave: even indices grow, odd shrink.
                // But to make it more interesting, we'll use a cosine‑based approach.
                const phase = (index / chars.length) * Math.PI * 2; // full cycle over the whole string
                // Map phase to [0, 1] using cosine: cos(phase) ∈ [-1, 1] → (cos(phase)+1)/2 ∈ [0,1]
                const t = (Math.cos(phase) + 1) / 2;
                // Scale to [minSize, maxSize]
                const size = minSize + t * (maxSize - minSize);
                span.style.fontSize = size + 'rem';

                // ── Optional: add a subtle text‑shadow to match the color ──
                span.style.textShadow = `0 0 12px ${colors[colorIndex]}44, 0 4px 12px rgba(0,0,0,0.3)`;

                container.appendChild(span);
            });

            // ── Extra: add a small "shine" animation via CSS custom property ──
            // We'll inject a style that makes characters pulse gently.
            const styleSheet = document.createElement('style');
            styleSheet.textContent = `
                        .hw-char {
                            animation: glowPulse 3s ease-in-out infinite alternate;
                        }
                        .hw-char:nth-child(odd) {
                            animation-delay: 0.2s;
                        }
                        .hw-char:nth-child(3n) {
                            animation-delay: 0.6s;
                        }
                        .hw-char:nth-child(5n+2) {
                            animation-delay: 1.0s;
                        }
                        @keyframes glowPulse {
                            0%   { filter: brightness(1) drop-shadow(0 0 4px rgba(255,255,255,0.0)); }
                            100% { filter: brightness(1.08) drop-shadow(0 0 18px rgba(255,255,255,0.15)); }
                        }
                    `;
            document.head.appendChild(styleSheet);

        })();
    </script>

</body>
</html>
